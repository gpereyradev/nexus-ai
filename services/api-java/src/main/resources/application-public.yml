# Enabled only in the public container. Local development keeps its defaults.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:verify-full}&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 60000
  web:
    resources:
      static-locations: file:/app/web/
server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
  tomcat:
    threads:
      max: 8
      min-spare: 1
    accept-count: 32
    max-connections: 64
nexus:
  analytics:
    url: http://127.0.0.1:8001
