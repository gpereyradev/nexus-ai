spring:
  application:
    name: nexus-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:nexus}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
  address: ${API_BIND_ADDRESS:127.0.0.1}
  port: ${API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
nexus:
  demo:
    enabled: ${DEMO_ENABLED:false}
    data-enabled: ${DEMO_DATA_ENABLED:false}
  analytics:
    enabled: ${ANALYTICS_ENABLED:false}
    url: ${ANALYTICS_URL:http://127.0.0.1:8001}
    key: ${ANALYTICS_API_KEY:}
    timeout-ms: ${ANALYTICS_TIMEOUT_MS:8000}
