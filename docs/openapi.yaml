openapi: 3.1.0
info:
  title: NEXUS AI API
  version: 0.4.0
  description: 'Demostración local de gestión y analítica Python: referencia semanal, Ridge evaluado, reglas y snapshots.
    Sin chatbot ni APIs comerciales.'
servers:
- url: /api/v1
security:
- sessionCookie: []
paths:
  /health:
    get:
      summary: Salud real Java/PostgreSQL
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /auth/csrf:
    get:
      summary: Obtener CSRF para el navegador
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /me:
    get:
      summary: Identidad actual
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/login:
    post:
      summary: Iniciar sesión; 10 intentos/IP/minuto
      responses:
        '204':
          description: Correcto, sin cuerpo
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      parameters:
      - &id001
        name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Token obtenido de GET /auth/csrf; renovar después de login/logout.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
              required:
              - email
              - password
  /auth/logout:
    post:
      summary: Invalidar sesión y cookie
      responses:
        '204':
          description: Correcto, sin cuerpo
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - *id001
      security: []
  /products:
    get:
      summary: Listar products
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 160
      - name: active
        in: query
        schema: &id004
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - sku
          - price
          - createdAt
          default: name
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: category
        in: query
        schema: &id002
          type: string
          format: uuid
    post:
      summary: Crear Product
      responses:
        '201':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      parameters:
      - *id001
      x-roles:
      - ADMIN
      - MANAGER
  /products/{id}:
    patch:
      summary: Editar o desactivar; todos los campos y versión son obligatorios
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEdit'
      parameters:
      - &id003
        name: id
        in: path
        required: true
        schema: *id002
      - *id001
      x-roles:
      - ADMIN
      - MANAGER
    get:
      summary: Consultar Product
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - *id003
  /customers:
    get:
      summary: Listar customers
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 160
      - name: active
        in: query
        schema: *id004
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - createdAt
          default: name
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
    post:
      summary: Crear Customer
      responses:
        '201':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      parameters:
      - *id001
      x-roles:
      - ADMIN
      - MANAGER
  /customers/{id}:
    patch:
      summary: Editar o desactivar; todos los campos y versión son obligatorios
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerEdit'
      parameters:
      - *id003
      - *id001
      x-roles:
      - ADMIN
      - MANAGER
    get:
      summary: Consultar Customer
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - *id003
  /categories:
    get:
      summary: Listar categories
      responses:
        '200':
          description: Categorías ordenadas por nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Crear Category
      responses:
        '201':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      parameters:
      - *id001
      x-roles:
      - ADMIN
      - MANAGER
  /categories/{id}:
    patch:
      summary: Editar o desactivar; todos los campos y versión son obligatorios
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryEdit'
      parameters:
      - *id003
      - *id001
      x-roles:
      - ADMIN
      - MANAGER
  /users:
    get:
      summary: Listar hasta 200 cuentas sin hashes
      responses:
        '200':
          description: Cuentas existentes
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/Account'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-roles:
      - ADMIN
    post:
      summary: Crear una cuenta
      responses:
        '201':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          description: Solicitud rechazada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      parameters:
      - *id001
      x-roles:
      - ADMIN
  /inventory:
    get:
      summary: Existencias calculadas desde el historial
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: category
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: lowOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - &id005
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - &id006
        name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        default: &id007
          description: Solicitud rechazada; 400 validación, 401 sesión, 403 rol/CSRF, 404 registro, 409 conflicto.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /inventory/movements:
    get:
      summary: Historial inmutable; fechas inclusivas de Lima
      parameters:
      - name: productId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - ENTRY
          - ADJUSTMENT
          - SALE
          - REVERSAL
      - &id008
        name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - &id009
        name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - *id005
      - *id006
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementPage'
        default: *id007
  /inventory/adjustments:
    post:
      summary: Registrar ingreso o ajuste con clave idempotente
      parameters:
      - &id010
        name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Token obtenido de GET /auth/csrf; renovar después de login/logout.
      x-roles:
      - ADMIN
      - MANAGER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustmentInput'
      responses:
        '200':
          description: Resultado previo idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
        default: *id007
        '201':
          description: Creado; repetir usuario/clave con los mismos datos devuelve 200. Otro contenido recibe 409.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
  /sales:
    get:
      summary: Ventas por código/cliente; fechas inclusivas de Lima
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
      - name: customer
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - *id008
      - *id009
      - *id005
      - *id006
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleSummaryPage'
        default: *id007
    post:
      summary: Confirmar venta atómica con clave idempotente
      parameters:
      - *id010
      x-roles:
      - ADMIN
      - MANAGER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleInput'
      responses:
        '200':
          description: Resultado previo idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
        default: *id007
        '201':
          description: Creado; repetir usuario/clave con los mismos datos devuelve 200. Otro contenido recibe 409.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
  /sales/{id}:
    get:
      summary: Detalle persistido con precios históricos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
        default: *id007
  /sales/{id}/cancel:
    post:
      summary: Anular una sola vez y devolver existencias
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id010
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationInput'
      responses:
        '200':
          description: Venta anulada o ya anulada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
        default: *id007
  /dashboard/summary:
    get:
      summary: Reporte consistente; últimos 30 días por defecto, máximo 366; stock bajo actual
      parameters:
      - *id008
      - *id009
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        default: *id007
  /analytics/forecast:
    post:
      summary: Generar y guardar análisis desde agregados propios de PostgreSQL; días completos hasta ayer
      x-roles: &id011
      - ADMIN
      - MANAGER
      - ANALYST
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Token obtenido de GET /auth/csrf; renovar después de login/logout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastInput'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResult'
        default: &id012
          description: 400 validación, 401 sin sesión, 403 rol/CSRF, 404 registro, 422 historial insuficiente, 503
            Python no disponible u ocupado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /analytics/runs:
    get:
      summary: Últimos 10 experimentos sin recalcular ni depender de Python
      x-roles: *id011
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisRunSummary'
                maxItems: 10
        default: *id012
  /analytics/runs/{id}:
    get:
      summary: Snapshot inmutable con stock al instante de generación
      x-roles: *id011
      parameters:
      - name: id
        in: path
        required: true
        schema: &id033
          type: string
          format: uuid
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResult'
        default: *id012
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    Role:
      type: string
      enum:
      - ADMIN
      - MANAGER
      - ANALYST
      - VIEWER
    Account:
      type: object
      properties:
        id: *id002
        displayName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        active: *id004
      required:
      - id
      - displayName
      - email
      - role
      - active
    NewAccount:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: Máximo 72 bytes UTF-8; se almacena con BCrypt.
        role:
          $ref: '#/components/schemas/Role'
      required:
      - displayName
      - email
      - password
      - role
    Money:
      type: string
      pattern: ^\d{1,10}(\.\d{1,2})?$
      description: Importe PEN no negativo, DECIMAL(12,2).
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      required:
      - status
      - code
    Csrf:
      type: object
      properties:
        token:
          type: string
        headerName:
          type: string
        parameterName:
          type: string
      required:
      - token
      - headerName
      - parameterName
    Health:
      type: object
      properties:
        status:
          const: UP
        application:
          const: nexus-api
        version:
          const: 0.4.0
        phase:
          const: F4
        database:
          const: UP
        currency:
          const: PEN
        timezone:
          const: America/Lima
        checkedAt:
          type: string
          format: date-time
      required:
      - status
      - application
      - version
      - phase
      - database
      - currency
      - timezone
      - checkedAt
    ProductInput:
      type: object
      properties:
        name: &id013
          type: string
          minLength: 1
          maxLength: 160
        active: *id004
        version: &id014
          type: integer
          minimum: 0
          format: int64
        sku: &id015
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9_-]+$
        categoryId: *id002
        cost: &id016
          $ref: '#/components/schemas/Money'
        price: &id017
          $ref: '#/components/schemas/Money'
        minStock: &id018
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
      - name
      - active
      - sku
      - categoryId
      - cost
      - price
      - minStock
    ProductEdit:
      allOf:
      - $ref: '#/components/schemas/ProductInput'
      - required:
        - version
    Product:
      type: object
      properties:
        name: *id013
        active: *id004
        version: *id014
        sku: *id015
        categoryId: *id002
        cost: *id016
        price: *id017
        minStock: *id018
        id: *id002
        categoryName:
          type: string
      required:
      - name
      - active
      - version
      - sku
      - categoryId
      - cost
      - price
      - minStock
      - id
      - categoryName
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    CustomerInput:
      type: object
      properties:
        name: *id013
        active: *id004
        version: *id014
        email:
          anyOf:
          - type: 'null'
          - type: string
            maxLength: 0
          - type: string
            format: email
            maxLength: 254
        phone: &id019
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: ^(?:|[+()0-9 -]{6,30})$
      required:
      - name
      - active
    CustomerEdit:
      allOf:
      - $ref: '#/components/schemas/CustomerInput'
      - required:
        - version
    Customer:
      type: object
      properties:
        name: *id013
        active: *id004
        version: *id014
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
        phone: *id019
        id: *id002
      required:
      - name
      - active
      - version
      - email
      - phone
      - id
    CustomerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    CategoryInput:
      type: object
      properties:
        name: &id020
          type: string
          minLength: 1
          maxLength: 100
        active: *id004
        version: *id014
      required:
      - name
      - active
    CategoryEdit:
      allOf:
